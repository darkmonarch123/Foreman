# kubectl apply -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: foreman
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  # Public settings only. Copy foreman.env.example to foreman.env (git-ignored).
  - name: foreman-config
    envs:
      - foreman.env
